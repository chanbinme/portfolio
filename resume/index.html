<!doctype html>
<!-- 이력서 페이지 (/portfolio/resume/). 배포할 때 이 페이지를 인쇄해 resume.pdf를 만듭니다 -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>김찬빈 · 이력서</title>
    <meta
      name="description"
      content="Java와 Spring 기반 백엔드 개발자 김찬빈의 이력서."
    />

    <!-- Open Graph (카카오톡·슬랙 링크 미리보기용) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="김찬빈 · 이력서" />
    <meta
      property="og:description"
      content="Java와 Spring 기반 백엔드 개발자 김찬빈의 이력서."
    />
    <meta property="og:url" content="https://chanbinme.github.io/portfolio/resume/" />
    <!-- og.png는 빌드할 때 profile.json으로 만듭니다 (tools/og-image.ts) -->
    <meta property="og:image" content="https://chanbinme.github.io/portfolio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="김찬빈 · Backend Engineer" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://chanbinme.github.io/portfolio/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- 다크 모드 첫 페인트 깜빡임(FOUC) 방지: React 로드 전에 클래스를 붙입니다 -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage 차단 환경 무시 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/resume.tsx"></script>
  </body>
</html>
